services:
  bookshelf:
    image: lijf0406/bookshelf:latest
    container_name: bookshelf
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      BOOKSHELF_DATA_DIR: /data
      # 日志按天轮转，自动清理，此值控制保留最近多少天（默认 14）
      BOOKSHELF_LOG_DAYS: 14
    volumes:
      - ./bookshelf-data:/data
    networks:
      - web-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/tags').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  web-network:
    external: true
