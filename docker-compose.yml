services:
  bookshelf:
    build: .
    image: bookshelf:latest
    container_name: bookshelf
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      BOOKSHELF_DATA_DIR: /data
    volumes:
      - bookshelf-data:/data
    networks:
      - web-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/tags').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bookshelf-data:

networks:
  web-network:
    external: true
